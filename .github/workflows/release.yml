# A tag 0.2.1 (or v0.2.1) pushed to the repository builds the plugin and publishes a release with
# SentisClientOptimisation-0.2.1-Setup.exe: automatic installation with a desktop shortcut.
#
# The plugin is built against the libraries of Space Engineers, which are not in the repository (they are not ours
# to hand out): the job downloads the dedicated server with SteamCMD (it is free to download without an account),
# keeps only the libraries, and caches them for a week. The plugin is built against them and ships without them:
# the game it loads into has them, and Harmony it patches the game with comes from Pulsar (from NuGet where Pulsar
# is not installed, as here).
#
# "Run workflow" on the Actions page builds the same installer without a release (it is left as the run's artifact).
name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp the build with (no release is made)
        default: 0.0.0-manual
        required: true

permissions:
  contents: write

env:
  PLUGIN: SentisClientOptimisation
  SE_ROOT: ${{ github.workspace }}\.se

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Week of the year (the game's libraries are fetched anew once a week)
        id: week
        shell: pwsh
        run: '"week=$(Get-Date -UFormat %Y-%V)" >> $env:GITHUB_OUTPUT'

      - name: Cached libraries of the game
        id: libs
        uses: actions/cache@v4
        with:
          path: .se
          key: se-ds-libs-${{ steps.week.outputs.week }}

      - name: Download Space Engineers Dedicated Server
        if: steps.libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tmp = $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force "$tmp\steamcmd", "$tmp\ds", "$env:SE_ROOT\DedicatedServer64" | Out-Null
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile "$tmp\steamcmd.zip"
          Expand-Archive "$tmp\steamcmd.zip" "$tmp\steamcmd" -Force
          # SteamCMD updates itself on its first run and may end with an error code though the download went through:
          # judged by what it left, tried up to three times
          $game = "$tmp\ds\DedicatedServer64\Sandbox.Game.dll"
          for ($try = 1; $try -le 3 -and -not (Test-Path $game); $try++) {
            & "$tmp\steamcmd\steamcmd.exe" +force_install_dir "$tmp\ds" +login anonymous +app_update 298740 +quit
            Write-Host "SteamCMD ended with $LASTEXITCODE (try $try)"
          }
          if (-not (Test-Path $game)) { throw 'The dedicated server was not downloaded' }
          Copy-Item "$tmp\ds\DedicatedServer64\*.dll" "$env:SE_ROOT\DedicatedServer64"
          $global:LASTEXITCODE = 0

      - name: Inno Setup 6.5.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid') { throw 'Inno Setup signature is not valid' }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $compiler + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          "INNO_COMPILER=$compiler\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build and pack
        id: pack
        shell: pwsh
        run: ./tools/release.ps1 -Version "${{ github.event_name == 'push' && github.ref_name || inputs.version }}" -SeBin "$env:SE_ROOT\DedicatedServer64" -Plugin "$env:PLUGIN"

      - name: Verify CLR and CoreCLR payload metadata
        shell: pwsh
        run: |
          dotnet run --project tools/RuntimeAdmission/RuntimeAdmission.csproj -c Release -- "dist/$env:PLUGIN/$env:PLUGIN.dll" "dist/$env:PLUGIN/SentisClientOptimisation.Interim.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime admission metadata checks failed' }

      - name: Verify staged installation scripts
        shell: powershell
        run: |
          python tools/test-packaging.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging checks failed' }
          python tools/test-release-artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset contract checks failed' }
          python tools/test-runtimeconfig-repair.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configuration recovery checks failed' }
          ./tools/test-progress.ps1 -HelpersOnly
          if ($LASTEXITCODE -ne 0) { throw 'Progress protocol checks failed' }
          ./tools/test-install.ps1 -PackagePath "$env:GITHUB_WORKSPACE/dist/$env:PLUGIN"
          if ($LASTEXITCODE -ne 0) { throw 'Installation lifecycle checks failed' }

      - name: Installer and standalone runtime DLLs as the run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}
          path: |
            ${{ steps.pack.outputs.installer }}
            dist/${{ env.PLUGIN }}/${{ env.PLUGIN }}.dll
            dist/${{ env.PLUGIN }}/SentisClientOptimisation.Interim.dll
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = '${{ steps.pack.outputs.installer }}'
          $assets = @(
            $installer,
            (Join-Path $env:GITHUB_WORKSPACE "dist\$env:PLUGIN\$env:PLUGIN.dll"),
            (Join-Path $env:GITHUB_WORKSPACE "dist\$env:PLUGIN\SentisClientOptimisation.Interim.dll")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @assets --clobber }
          else { gh release create $tag @assets --title "$env:PLUGIN $tag" --generate-notes --verify-tag }
          if ($LASTEXITCODE -ne 0) { throw "The release was not published ($LASTEXITCODE)" }
